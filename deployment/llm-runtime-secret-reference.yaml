# Reference-only manifest: no secret value is stored here.
# The actual API credential is written to OpenBao at the referenced path.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: telecom-triage-llm-provider
  namespace: default
  labels:
    openchoreo.dev/component: telco-incident-triage
    openchoreo.dev/project: default
spec:
  refreshInterval: 15s
  data:
    - secretKey: api_key
      remoteRef:
        key: secret/default/generic/telecom-triage-llm-provider
        property: api_key
  template:
    type: Opaque
    metadata:
      labels:
        openchoreo.dev/component: telco-incident-triage
        openchoreo.dev/project: default
